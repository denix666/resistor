
[package]
name = "resistor"
version = "0.3.0"
edition = "2024"
authors = ["Denis Salmanovich"]
readme = "README.md"
description = "Resistor color code calculator written in Rust using eframe/egui."
repository = "https://github.com/denix666/resistor"
license-file = "LICENSE"

[dependencies]
eframe = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
